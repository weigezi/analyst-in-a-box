[project]
name = "analyst-in-a-box"
version = "0.1.0"
description = "A skill that explains why a business number moved, and who should act next."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["skills/analyst-in-a-box/scripts"]
testpaths = ["tests"]
