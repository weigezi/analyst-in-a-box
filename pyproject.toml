[project]
name = "analyst-in-a-box"
version = "0.2.1"
description = "Turn the few tables you have into an AI analyst that answers questions, in one go."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["skills/analyst-in-a-box/scripts"]
testpaths = ["tests"]
