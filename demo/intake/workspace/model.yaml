north_star: gross_profit
measures:
  m_revenue:
    label: &id002
      zh: 营收
      en: Revenue
    source: orders
    agg: sum
    column: revenue
    date: order_date
    dimensions:
    - channel
    - category
    - region
    - city
    - delivery
    - customer_type
  m_gross_profit:
    label: &id003
      zh: 毛利
      en: Gross Profit
    source: orders
    agg: sum
    column: gross_profit
    date: order_date
    dimensions:
    - channel
    - category
    - region
    - city
    - delivery
    - customer_type
  m_visits:
    label: &id005
      zh: 访问量
      en: Visits
    source: traffic
    agg: sum
    column: visits
    date: date
    dimensions:
    - channel
  m_count:
    source: orders
    agg: count_distinct
    column: order_id
    date: order_date
    dimensions: &id001
    - channel
    - category
    - region
    - city
    - delivery
    - customer_type
    additive_over: *id001
    where_filled: revenue
metrics:
  revenue:
    label: *id002
    measure: m_revenue
    unit: currency
    role: amount
    source: &id004
      kind: user
      date: '2026-10-31'
    status: confirmed
  gross_profit:
    label: *id003
    measure: m_gross_profit
    unit: currency
    role: profit
    source: *id004
    status: confirmed
  visits:
    label: *id005
    measure: m_visits
    unit: count
    role: visits
    source: *id004
    status: confirmed
  id_count:
    label:
      en: Orders
      zh: 订单数
    measure: m_count
    unit: count
    source: *id004
    status: confirmed
  per_id:
    label:
      en: Average order value
      zh: 客单价
    kind: ratio
    numerator: revenue
    denominator: id_count
    unit: currency
    source:
      kind: formula
      ref: templates/formulas/orders.yaml
    status: confirmed
  margin:
    label:
      en: Margin rate
      zh: 毛利率
    kind: ratio
    numerator: gross_profit
    denominator: revenue
    unit: ratio
    source:
      kind: formula
      ref: templates/formulas/orders.yaml
    status: confirmed
  conversion:
    label:
      en: Conversion rate
      zh: 转化率
    kind: ratio
    numerator: id_count
    denominator: visits
    unit: ratio
    source:
      kind: formula
      ref: templates/formulas/orders.yaml
    status: confirmed
identities:
- id: revenue_by_per_id
  left: revenue
  factors:
  - id_count
  - per_id
  operator: multiply
  source:
    kind: formula
  status: confirmed
- id: gross_profit_by_margin
  left: gross_profit
  factors:
  - revenue
  - margin
  operator: multiply
  source:
    kind: formula
  status: confirmed
- id: id_count_by_conversion
  left: id_count
  factors:
  - visits
  - conversion
  operator: multiply
  source:
    kind: formula
  status: confirmed
dimensions:
  channel:
    label:
      zh: 渠道
      en: Channel
    column: channel
  category:
    label:
      zh: 品类
      en: Category
    column: category
  region:
    label:
      zh: 大区
      en: Region
    column: region
  city:
    label:
      zh: 城市
      en: City
    column: city
  delivery:
    label:
      zh: 配送方式
      en: Delivery
    column: delivery
  customer_type:
    label:
      zh: 客户类型
      en: Customer Type
    column: customer_type
priorities:
  revenue:
    order:
    - channel
    - category
    - region
    - city
    - delivery
    - customer_type
    mode: drill
    source:
      kind: user
      date: '2026-10-31'
      note: order of the user's selection; not yet a priority, so every layer is chosen by score until the user confirms one
    status: proposed
