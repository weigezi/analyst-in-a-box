# Named thresholds and the decision tables that use them.
# Every threshold says where it came from. "demo_setting" means: chosen for this fictional shop, set your own.

params:
  unusual_z:
    value: 3.5
    source: {kind: document, ref: "B. Iglewicz & D. Hoaglin (1993), How to Detect and Handle Outliers: modified z-scores beyond 3.5 are labelled potential outliers"}
    status: confirmed
  unusual_z_low:
    value: -3.5
    source: {kind: document, ref: "Same source as unusual_z, applied to the low side"}
    status: confirmed
  single_point_min_share:
    value: 0.5
    source: {kind: demo_setting, note: "A segment carrying at least half of all movement counts as a single point."}
    status: confirmed
  own_share_min:
    value: 0.5
    source: {kind: demo_setting, note: "If at least half of the change is our own, break it down internally."}
    status: confirmed
  external_slice_min_share:
    value: 0.5
    source: {kind: demo_setting, note: "An outside event must touch the slice that carries at least half of the change."}
    status: confirmed
  external_size_min_share:
    value: 0.6
    source: {kind: demo_setting, note: "At least 60% of that slice's change must fall on the event's days."}
    status: confirmed
  # Added in 0.2. The defaults (scripts/aib/defaults.py) are the same values; they are written out here so the
  # demo shows every number it uses. Data-quality params not listed here fall back to those defaults.
  single_point_min_excess:
    value: 0.25
    source: {kind: demo_setting, note: "The top group must carry at least 25% more of the movement than its share of the base would give it (0 = in step, 1 = all of it)."}
    status: confirmed
  single_point_min_excess_no_history:
    value: 0.6
    source: {kind: demo_setting, note: "Without history to judge noise, demand a much clearer single point."}
    status: confirmed
  segment_z_min:
    value: 3.0
    source: {kind: demo_setting, note: "A group's own change must be this far from its own history (robust z)."}
    status: confirmed
  segment_z_min_when_unusual:
    value: 2.0
    source: {kind: demo_setting, note: "When the whole number is already unusual, a group's own z only has to rule out ordinary noise."}
    status: confirmed
  segment_min_n:
    value: 30
    source: {kind: demo_setting, note: "Groups with fewer rows are not named as a single point."}
    status: confirmed
  drill_when_usual:
    value: false
    source: {kind: demo_setting, note: "When the whole number is within its usual range, report and do not drill."}
    status: confirmed

tables:
  - id: qualify.unusual
    question: {en: "Is this period unusual against its own history?", zh: "这一期和自己的历史比，算不算异常？"}
    inputs: {robust_z: qualify.robust_z}
    hit_policy: FIRST
    rows:
      - when: {robust_z: {gte: "param:unusual_z"}}
        then: {verdict: unusual_high}
      - when: {robust_z: {lte: "param:unusual_z_low"}}
        then: {verdict: unusual_low}
      - when: {}
        then: {verdict: within_usual_range}

  - id: qualify.market
    question: {en: "Did the market move us, or did we move ourselves?", zh: "是大盘带着走，还是自己的问题？"}
    inputs: {own_share: qualify.own_share}
    hit_policy: FIRST
    rows:
      - when: {own_share: {gte: "param:own_share_min"}}
        then: {verdict: own, next: break_down_internally}
      - when: {own_share: {not_null: true}}
        then: {verdict: market, next: report_market_first}
      - when: {}
        then: {verdict: no_market_data}

  # 0.2: the cut table reads the noise gate (search.gate), not only the top group's share.
  - id: stop.cut
    question: {en: "After a cut, drill into the top segment or stop here?", zh: "切完这一刀，往第一名下钻，还是停在这一层？"}
    inputs: {overall_quiet: cut.overall_quiet, top1_beats_quiet: cut.top1_beats_quiet, context_unusual: cut.context_unusual,
             top1_excess: cut.top1_excess, top1_abs_z: cut.top1_abs_z, top1_n: cut.top1_n, has_history: cut.has_history,
             order: cut.order, top1_abs_share: cut.top1_abs_share}
    hit_policy: FIRST
    rows:
      - when: {all: [{overall_quiet: {eq: true}}, {top1_beats_quiet: {eq: false}}]}
        then: {action: stop, reason: whole_number_within_usual_range}
      - when: {top1_n: {lt: "param:segment_min_n"}}
        then: {action: stop, reason: top_group_too_small}
      - when: {all: [{order: {eq: second}}, {top1_abs_share: {gte: "param:single_point_min_share"}},
                     {top1_excess: {gte: "param:single_point_min_excess"}}]}
        then: {action: drill, reason: single_point}
      - when: {all: [{overall_quiet: {eq: true}}, {top1_beats_quiet: {eq: true}},
                     {top1_excess: {gte: "param:single_point_min_excess"}}, {top1_abs_share: {gte: "param:single_point_min_share"}}]}
        then: {action: drill, reason: single_point_inside_a_quiet_total}
      - when: {all: [{context_unusual: {eq: true}}, {top1_abs_share: {gte: "param:single_point_min_share"}},
                     {top1_excess: {gte: "param:single_point_min_excess"}}, {top1_abs_z: {gte: "param:segment_z_min_when_unusual"}}]}
        then: {action: drill, reason: single_point}
      - when: {all: [{top1_abs_share: {gte: "param:single_point_min_share"}}, {top1_excess: {gte: "param:single_point_min_excess"}},
                     {top1_abs_z: {gte: "param:segment_z_min"}}]}
        then: {action: drill, reason: single_point}
      - when: {all: [{has_history: {eq: false}}, {order: {eq: first}},
                     {top1_excess: {gte: "param:single_point_min_excess_no_history"}}]}
        then: {action: drill, reason: single_point_without_history}
      - when: {}
        then: {action: stop, reason: spread_or_noise}
